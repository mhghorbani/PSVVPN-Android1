name: Build PSVVPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build signed Debug APK
        run: |
          dotnet build PSVVPN.Android.csproj \
            -c Debug \
            -f net9.0-android \
            -p:AndroidPackageFormat=apk

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find bin/Debug -type f -name "*.apk" -print

      - name: Collect signed APK
        run: |
          mkdir -p out

          APK=$(find bin/Debug -type f -name "*-Signed.apk" | head -1)

          if [ -z "$APK" ]; then
            APK=$(find bin/Debug -type f -name "*.apk" | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "Using APK: $APK"

          cp "$APK" \
            out/PSVVPN-Android-0.3-pilot-signed.apk

          ls -lh out

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PSVVPN-Android-0.3-pilot-signed
          path: out/PSVVPN-Android-0.3-pilot-signed.apk
          if-no-files-found: error
          retention-days: 30
