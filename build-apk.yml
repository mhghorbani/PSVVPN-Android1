name: Build PSVVPN APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build APK
        run: dotnet publish PSVVPN.Android.csproj -c Release -f net9.0-android -p:AndroidPackageFormat=apk
      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find bin/Release -name '*.apk' -type f | head -1)
          cp "$APK" out/PSVVPN-Android-0.2-pilot.apk
          ls -lah out
      - uses: actions/upload-artifact@v4
        with:
          name: PSVVPN-Android-0.2-pilot
          path: out/PSVVPN-Android-0.2-pilot.apk
